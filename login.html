<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Login · Drugs n' More</title><link rel="stylesheet" href="common.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></head>
<body style="background:#f4f7fa;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div class="login-box" style="margin:auto;">
        <div class="brand"><i class="fas fa-pills"></i>Drugs n' More</div>
        <div class="default-creds"><strong>Default Admin:</strong> admin@drugsnmore.com / admin123</div>
        <div id="loginError" style="color:#e74c3c;font-size:0.85rem;margin-bottom:12px;display:none;"></div>
        <div class="form-group"><label>Email</label><input id="loginEmail" placeholder="user@example.com" value="admin@drugsnmore.com" /></div>
        <div class="form-group"><label>Password</label><input id="loginPassword" type="password" placeholder="••••••••" value="admin123" /></div>
        <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        <div class="alt">Don't have an account? <a href="#" id="goToRegister">Register</a></div>
        <div class="alt"><a href="#" id="goToResetPass">Forgot password?</a></div>
    </div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            attachLoginHandlers();
            // if already logged in, redirect to index
            auth.onAuthStateChanged(user => { if (user) location.href = 'index.html'; });
        });
    </script>
</body>
</html>
