<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin · Drugs n' More</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <!-- Sidebar, header, content – same as before -->
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- same sidebar --></aside>
    <div class="main">
        <header class="header"><!-- same header --></header>
        <div class="content">
            <div class="page-header"><h2>Super Admin</h2><span class="sub">Create &amp; delete admins · extended configurations</span></div>
            <div class="grid-2">
                <div class="card">
                    <div class="card-title"><i class="fas fa-user-plus"></i> Create Admin</div>
                    <div class="form-group"><label>Email</label><input id="superCreateAdminEmail" placeholder="admin@example.com" /></div>
                    <div class="form-group"><label>Password</label><input id="superCreateAdminPass" type="password" placeholder="••••••••" /></div>
                    <button class="btn btn-primary" id="superCreateAdminBtn"><i class="fas fa-user-shield"></i> Create Admin</button>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-user-minus"></i> Delete Admin</div>
                    <div class="form-group"><label>Admin Email</label><input id="superDeleteAdminEmail" placeholder="admin@example.com" /></div>
                    <button class="btn btn-danger" id="superDeleteAdminBtn"><i class="fas fa-trash"></i> Delete Admin</button>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-cogs"></i> Extended Configurations</div>
                <div class="form-row">
                    <div class="form-group"><label>System Name</label><input id="configSystemName" value="Drugs n' More" /></div>
                    <div class="form-group"><label>Currency</label><input id="configCurrency" value="USD" /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Default Tax (%)</label><input id="configTax" type="number" value="7.5" /></div>
                    <div class="form-group"><label>Default Discount (%)</label><input id="configDiscount" type="number" value="0" /></div>
                </div>
                <button class="btn btn-primary" id="saveConfigBtn"><i class="fas fa-save"></i> Save Config</button>
            </div>
        </div>
    </div>
    <!-- login overlay -->
    <div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;"><!-- same login box --></div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(() => {});
            attachLoginHandlers();
            // ... rest of the super-admin logic (same as before)
        });
    </script>
</body>
</html>
