<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Super Admin · Drugs n' More</title><link rel="stylesheet" href="common.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></head>
<body>
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- same sidebar with "Super Admin" active --></aside>
    <div class="main">
        <header class="header"><!-- header --></header>
        <div class="content">
            <div class="page-header"><h2>Super Admin</h2><span class="sub">Create &amp; delete admins · extended configurations</span></div>
            <div class="grid-2">
                <div class="card">
                    <div class="card-title"><i class="fas fa-user-plus"></i> Create Admin</div>
                    <div class="form-group"><label>Email</label><input id="superCreateAdminEmail" placeholder="admin@example.com" /></div>
                    <div class="form-group"><label>Password</label><input id="superCreateAdminPass" type="password" placeholder="••••••••" /></div>
                    <button class="btn btn-primary" id="superCreateAdminBtn"><i class="fas fa-user-shield"></i> Create Admin</button>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-user-minus"></i> Delete Admin</div>
                    <div class="form-group"><label>Admin Email</label><input id="superDeleteAdminEmail" placeholder="admin@example.com" /></div>
                    <button class="btn btn-danger" id="superDeleteAdminBtn"><i class="fas fa-trash"></i> Delete Admin</button>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-cogs"></i> Extended Configurations</div>
                <div class="form-row">
                    <div class="form-group"><label>System Name</label><input id="configSystemName" value="Drugs n' More" /></div>
                    <div class="form-group"><label>Currency</label><input id="configCurrency" value="USD" /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Default Tax (%)</label><input id="configTax" type="number" value="7.5" /></div>
                    <div class="form-group"><label>Default Discount (%)</label><input id="configDiscount" type="number" value="0" /></div>
                </div>
                <button class="btn btn-primary" id="saveConfigBtn"><i class="fas fa-save"></i> Save Config</button>
            </div>
        </div>
    </div>
    <div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;"><!-- login --></div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(() => {});
            attachLoginHandlers();
            document.getElementById('superCreateAdminBtn').addEventListener('click', async () => {
                if (currentUserRole !== 'superadmin') { showToast('Super admin only', 'error'); return; }
                const email = document.getElementById('superCreateAdminEmail').value.trim();
                const pass = document.getElementById('superCreateAdminPass').value;
                if (!email || !pass) { showToast('Please fill in all fields', 'error'); return; }
                try {
                    const cred = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection('users').doc(cred.user.uid).set({ email, role: 'admin', displayName: email, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    showToast('Admin created!');
                    document.getElementById('superCreateAdminEmail').value = '';
                    document.getElementById('superCreateAdminPass').value = '';
                } catch(e) { showToast(e.message, 'error'); }
            });
            document.getElementById('superDeleteAdminBtn').addEventListener('click', async () => {
                if (currentUserRole !== 'superadmin') { showToast('Super admin only', 'error'); return; }
                const email = document.getElementById('superDeleteAdminEmail').value.trim();
                if (!email) { showToast('Please enter admin email', 'error'); return; }
                try {
                    const snap = await db.collection('users').where('email', '==', email).where('role', '==', 'admin').get();
                    if (snap.empty) { showToast('Admin not found', 'error'); return; }
                    snap.forEach(doc => doc.ref.delete());
                    showToast('Admin removed');
                    document.getElementById('superDeleteAdminEmail').value = '';
                } catch(e) { showToast(e.message, 'error'); }
            });
            document.getElementById('saveConfigBtn').addEventListener('click', async () => {
                if (currentUserRole !== 'superadmin') { showToast('Super admin only', 'error'); return; }
                const data = {
                    systemName: document.getElementById('configSystemName').value,
                    currency: document.getElementById('configCurrency').value,
                    tax: parseFloat(document.getElementById('configTax').value) || 0,
                    discount: parseFloat(document.getElementById('configDiscount').value) || 0,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                try {
                    await db.collection('config').doc('extended').set(data, { merge: true });
                    showToast('Config saved!');
                } catch(e) { showToast(e.message, 'error'); }
            });
        });
    </script>
</body>
</html>
