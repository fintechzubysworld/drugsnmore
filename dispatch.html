<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Dispatch · Drugs n' More</title><link rel="stylesheet" href="common.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></head>
<body>
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- sidebar with dispatch active --></aside>
    <div class="main">
        <header class="header"><!-- header --></header>
        <div class="content">
            <div class="page-header"><h2>Dispatch</h2><div class="actions"><button class="btn btn-primary" id="newDispatchBtn"><i class="fas fa-plus"></i> New Dispatch</button></div></div>
            <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Destination</th><th>Items</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="dispatchTable"><tr><td colspan="6" style="text-align:center;color:var(--text-light)">No dispatches</td></tr></tbody></table></div></div>
        </div>
    </div>
    <!-- login & modal -->
    <div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;"><!-- login --></div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:999;">
        <div class="modal" style="background:#fff;border-radius:14px;max-width:640px;width:94%;max-height:90vh;overflow-y:auto;padding:28px 32px;">
            <div class="modal-header"><h3>New Dispatch</h3><button class="close" id="modalClose">&times;</button></div>
            <div id="modalBody">
                <div class="form-group"><label>Destination</label><input id="dispatchDest" placeholder="Branch name" /></div>
                <div class="form-group"><label>Items (comma separated)</label><input id="dispatchItems" placeholder="Item1, Item2" /></div>
                <div class="form-group"><label>Notes</label><textarea id="dispatchNotes" rows="2"></textarea></div>
                <button class="btn btn-primary" id="saveDispatchBtn"><i class="fas fa-truck"></i> Create Dispatch</button>
            </div>
        </div>
    </div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(loadDispatches);
            attachLoginHandlers();
            // modal logic
            const modal = document.getElementById('modalOverlay');
            document.getElementById('newDispatchBtn').addEventListener('click', () => modal.style.display = 'flex');
            document.getElementById('modalClose').addEventListener('click', () => modal.style.display = 'none');
            modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
            document.getElementById('saveDispatchBtn').addEventListener('click', async () => {
                const dest = document.getElementById('dispatchDest').value.trim();
                const items = document.getElementById('dispatchItems').value.trim();
                const notes = document.getElementById('dispatchNotes').value.trim();
                if (!dest || !items) { showToast('Please fill in destination and items', 'error'); return; }
                try {
                    await db.collection('dispatches').add({
                        destination: dest,
                        items: items.split(',').map(s => s.trim()),
                        status: 'pending',
                        notes: notes,
                        createdBy: currentUser?.uid || 'system',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast('Dispatch created!');
                    modal.style.display = 'none';
                    loadDispatches();
                } catch(e) { showToast(e.message, 'error'); }
            });

            async function loadDispatches() {
                try {
                    const snap = await db.collection('dispatches').orderBy('createdAt', 'desc').get();
                    const tbody = document.getElementById('dispatchTable');
                    if (snap.empty) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-light)">No dispatches</td></tr>'; return; }
                    let html = '';
                    snap.forEach(doc => {
                        const d = doc.data();
                        html += `<tr><td>${doc.id.slice(0,6)}</td><td>${d.destination||'—'}</td><td>${d.items||0}</td><td><span class="badge ${d.status==='pending'?'badge-warning':d.status==='completed'?'badge-success':'badge-info'}">${d.status||'pending'}</span></td><td>${d.createdAt?.toDate?.()?.toLocaleDateString()||'—'}</td><td><button class="btn btn-sm btn-outline" onclick="viewDispatch('${doc.id}')">View</button></td></tr>`;
                    });
                    tbody.innerHTML = html;
                    window.viewDispatch = async (id) => {
                        const doc = await db.collection('dispatches').doc(id).get();
                        if (!doc.exists) return showToast('Not found', 'error');
                        const d = doc.data();
                        alert(`Dispatch ${id.slice(0,6)}\nDestination: ${d.destination||'—'}\nItems: ${d.items||0}\nStatus: ${d.status||'pending'}\nDate: ${d.createdAt?.toDate?.()?.toLocaleString()||'—'}`);
                    };
                } catch(e) { console.warn(e); }
            }
        });
    </script>
</body>
</html>
