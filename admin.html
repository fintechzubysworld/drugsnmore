<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin Management · Drugs n' More</title><link rel="stylesheet" href="common.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></head>
<body>
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- same sidebar with "Admin" active --></aside>
    <div class="main">
        <header class="header"><!-- header --></header>
        <div class="content">
            <div class="page-header"><h2>Admin Management</h2><span class="sub">Manage admin users</span></div>
            <div class="card"><div class="table-wrap"><table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminTable"><tr><td colspan="4" style="text-align:center;color:var(--text-light)">No admin users</td></tr></tbody></table></div></div>
        </div>
    </div>
   <!-- LOGIN OVERLAY (hidden by default) -->
<div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;">
    <div class="login-box">
        <div class="brand"><i class="fas fa-pills"></i>Drugs n' More</div>
        <!-- No hard-coded credentials -->
        <div id="loginError" style="color:#e74c3c;font-size:0.85rem;margin-bottom:12px;display:none;"></div>
        <div class="form-group"><label>Email</label><input id="loginEmail" type="email" placeholder="Enter your email" /></div>
        <div class="form-group"><label>Password</label><input id="loginPassword" type="password" placeholder="Enter your password" /></div>
        <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        <div class="alt">Don't have an account? <a href="#" id="goToRegister">Register</a></div>
        <div class="alt"><a href="#" id="goToResetPass">Forgot password?</a></div>
    </div>
</div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(loadAdmins);
            attachLoginHandlers();
            async function loadAdmins() {
                try {
                    const snap = await db.collection('users').where('role', 'in', ['admin', 'superadmin']).get();
                    const tbody = document.getElementById('adminTable');
                    if (snap.empty) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-light)">No admin users</td></tr>'; return; }
                    let html = '';
                    snap.forEach(doc => {
                        const d = doc.data();
                        const isSuper = d.role === 'superadmin';
                        html += `<tr><td>${d.email||'—'}</td><td>${isSuper?'<span class="super-badge">Super Admin</span>':'<span class="admin-badge">Admin</span>'}</td><td><span class="badge badge-success">active</span></td><td>${currentUserRole==='superadmin'&&!isSuper?`<button class="btn btn-sm btn-danger" onclick="deleteUser('${doc.id}')"><i class="fas fa-trash"></i></button>`:'—'}</td></tr>`;
                    });
                    tbody.innerHTML = html;
                    window.deleteUser = async (id) => {
                        if (!confirm('Delete this admin?')) return;
                        try { await db.collection('users').doc(id).delete(); showToast('Admin removed'); loadAdmins(); } catch(e) { showToast(e.message, 'error'); }
                    };
                } catch(e) { console.warn(e); }
            }
        });
    </script>
</body>
</html>
