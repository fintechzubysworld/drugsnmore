<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Invoice Repository · Drugs n' More</title><link rel="stylesheet" href="common.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></head>
<body>
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- sidebar with "Invoice Repository" active --></aside>
    <div class="main">
        <header class="header"><!-- header --></header>
        <div class="content">
            <div class="page-header"><h2>Invoice Repository</h2><div class="actions"><button class="btn btn-primary" id="newInvoiceBtn"><i class="fas fa-plus"></i> New Invoice</button></div></div>
            <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Supplier</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="invoiceTable"><tr><td colspan="6" style="text-align:center;color:var(--text-light)">No invoices</td></tr></tbody></table></div></div>
        </div>
    </div>
    <div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;"><!-- login --></div>
    <div class="modal-overlay" id="modalOverlay"><!-- modal --></div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(loadInvoices);
            attachLoginHandlers();
            // modal logic (similar to dispatch)
            const modal = document.getElementById('modalOverlay');
            document.getElementById('newInvoiceBtn').addEventListener('click', () => {
                modal.style.display = 'flex';
                document.getElementById('modalBody').innerHTML = `
                    <div class="form-group"><label>Supplier</label><input id="invSupplier" placeholder="Supplier name" /></div>
                    <div class="form-group"><label>Amount</label><input id="invAmount" type="number" step="0.01" value="0" /></div>
                    <div class="form-group"><label>Status</label><select id="invStatus"><option value="pending">Pending</option><option value="paid">Paid</option></select></div>
                    <button class="btn btn-primary" id="saveInvBtn"><i class="fas fa-save"></i> Create Invoice</button>
                `;
                document.getElementById('saveInvBtn').addEventListener('click', async () => {
                    const supplier = document.getElementById('invSupplier').value.trim();
                    const amount = parseFloat(document.getElementById('invAmount').value) || 0;
                    const status = document.getElementById('invStatus').value;
                    if (!supplier) { showToast('Supplier is required', 'error'); return; }
                    try {
                        await db.collection('invoices').add({ supplier, amount, status, createdBy: currentUser?.uid || 'system', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                        showToast('Invoice created!');
                        modal.style.display = 'none';
                        loadInvoices();
                    } catch(e) { showToast(e.message, 'error'); }
                });
            });
            document.getElementById('modalClose').addEventListener('click', () => modal.style.display = 'none');
            modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

            async function loadInvoices() {
                try {
                    const snap = await db.collection('invoices').orderBy('createdAt', 'desc').get();
                    const tbody = document.getElementById('invoiceTable');
                    if (snap.empty) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-light)">No invoices</td></tr>'; return; }
                    let html = '';
                    snap.forEach(doc => {
                        const d = doc.data();
                        html += `<tr><td>${doc.id.slice(0,6)}</td><td>${d.supplier||'—'}</td><td>$${d.amount||0}</td><td><span class="badge ${d.status==='paid'?'badge-success':d.status==='pending'?'badge-warning':'badge-info'}">${d.status||'pending'}</span></td><td>${d.createdAt?.toDate?.()?.toLocaleDateString()||'—'}</td><td><button class="btn btn-sm btn-outline" onclick="viewInvoice('${doc.id}')">View</button></td></tr>`;
                    });
                    tbody.innerHTML = html;
                    window.viewInvoice = async (id) => {
                        const doc = await db.collection('invoices').doc(id).get();
                        if (!doc.exists) return showToast('Not found', 'error');
                        const d = doc.data();
                        alert(`Invoice ${id.slice(0,6)}\nSupplier: ${d.supplier||'—'}\nAmount: $${d.amount||0}\nStatus: ${d.status||'pending'}\nDate: ${d.createdAt?.toDate?.()?.toLocaleString()||'—'}`);
                    };
                } catch(e) { console.warn(e); }
            }
        });
    </script>
</body>
</html>
