<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users · Drugs n' More</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <!-- toast, sidebar, header, content – same as before -->
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- sidebar with Users active --></aside>
    <div class="main">
        <header class="header"><!-- header --></header>
        <div class="content">
            <div class="page-header"><h2>Users</h2><div class="actions"><button class="btn btn-primary" id="newUserBtn"><i class="fas fa-plus"></i> Add User</button></div></div>
            <div class="card"><div class="table-wrap"><table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="usersTable"><tr><td colspan="4" style="text-align:center;color:var(--text-light)">No users</td></tr></tbody></table></div></div>
        </div>
    </div>
    <!-- login overlay -->
    <div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;"><!-- login box --></div>
    <!-- modal for add user -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:999;">
        <div class="modal" style="background:#fff;border-radius:14px;max-width:640px;width:94%;max-height:90vh;overflow-y:auto;padding:28px 32px;">
            <div class="modal-header"><h3>Add User</h3><button class="close" id="modalClose">&times;</button></div>
            <div id="modalBody">
                <div class="form-group"><label>Email</label><input id="newUserEmail" placeholder="user@example.com" /></div>
                <div class="form-group"><label>Password</label><input id="newUserPass" type="password" placeholder="••••••••" /></div>
                <div class="form-group"><label>Role</label>
                    <select id="newUserRole">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <!-- Admin password field -->
                <div class="form-group" style="margin-top:12px;border-top:1px solid #eef1f5;padding-top:16px;">
                    <label><i class="fas fa-shield-alt"></i> Your Admin Password (to stay logged in)</label>
                    <input id="adminPasswordForCreation" type="password" placeholder="Enter your password to create user" />
                    <span style="font-size:0.75rem;color:var(--text-light);">We need your password to keep you logged in after creating the new user.</span>
                </div>
                <button class="btn btn-primary" id="saveUserBtn"><i class="fas fa-user-plus"></i> Create User</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(loadUsers);
            attachLoginHandlers();
            // modal logic
            const modal = document.getElementById('modalOverlay');
            document.getElementById('newUserBtn').addEventListener('click', () => modal.style.display = 'flex');
            document.getElementById('modalClose').addEventListener('click', () => modal.style.display = 'none');
            modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

            document.getElementById('saveUserBtn').addEventListener('click', async () => {
                const email = document.getElementById('newUserEmail').value.trim();
                const pass = document.getElementById('newUserPass').value;
                const role = document.getElementById('newUserRole').value;
                const adminPass = document.getElementById('adminPasswordForCreation').value;

                if (!email || !pass) { showToast('Please fill in email and password', 'error'); return; }
                if (!adminPass) { showToast('Please enter your admin password to create a user', 'error'); return; }

                // Store current admin email
                const adminEmail = currentUser.email;

                try {
                    // 1. Create the new user
                    const cred = await auth.createUserWithEmailAndPassword(email, pass);
                    // 2. Store the new user's info in Firestore
                    await db.collection('users').doc(cred.user.uid).set({
                        email: email,
                        role: role,
                        displayName: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 3. Sign out the newly created user and sign back in as the original admin
                    await auth.signOut();
                    await auth.signInWithEmailAndPassword(adminEmail, adminPass);

                    showToast('User created successfully! You are still logged in as admin.', 'success');
                    modal.style.display = 'none';
                    // Clear fields
                    document.getElementById('newUserEmail').value = '';
                    document.getElementById('newUserPass').value = '';
                    document.getElementById('adminPasswordForCreation').value = '';
                    loadUsers(); // refresh list
                } catch (e) {
                    if (e.code === 'auth/wrong-password') {
                        showToast('Incorrect admin password. Please try again.', 'error');
                    } else {
                        showToast(e.message, 'error');
                    }
                    // If error, we might be signed out; let auth state handle re-login
                }
            });

            async function loadUsers() {
                try {
                    const snap = await db.collection('users').get();
                    const tbody = document.getElementById('usersTable');
                    if (snap.empty) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-light)">No users</td></tr>'; return; }
                    let html = '';
                    snap.forEach(doc => {
                        const d = doc.data();
                        const role = d.role || 'user';
                        const isSuper = role === 'superadmin';
                        const isAdmin = role === 'admin';
                        html += `<tr><td>${d.email||'—'}</td><td>${isSuper?'<span class="super-badge">Super Admin</span>':isAdmin?'<span class="admin-badge">Admin</span>':'<span class="chip">User</span>'}</td><td><span class="badge badge-success">active</span></td><td>${currentUserRole==='superadmin'&&!isSuper?`<button class="btn btn-sm btn-danger" onclick="deleteUser('${doc.id}')"><i class="fas fa-trash"></i></button>`:'—'}</td></tr>`;
                    });
                    tbody.innerHTML = html;
                    window.deleteUser = async (id) => {
                        if (!confirm('Delete this user?')) return;
                        try { await db.collection('users').doc(id).delete(); showToast('User deleted'); loadUsers(); } catch(e) { showToast(e.message, 'error'); }
                    };
                } catch(e) { console.warn(e); }
            }
        });
    </script>
</body>
</html>
