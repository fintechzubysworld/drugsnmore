<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Profile · Drugs n' More</title><link rel="stylesheet" href="common.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></head>
<body>
    <div id="toast" class="toast"><i></i><span id="toastMsg"></span></div>
    <aside class="sidebar" id="sidebar"><!-- same sidebar as index, with profile active --></aside>
    <div class="main">
        <header class="header"><!-- same header --></header>
        <div class="content">
            <div class="page-header"><h2>Profile</h2></div>
            <div class="card">
                <div class="form-row">
                    <div class="form-group"><label>Display Name</label><input id="profileName" /></div>
                    <div class="form-group"><label>Email</label><input id="profileEmail" disabled /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Role</label><input id="profileRole" disabled /></div>
                    <div class="form-group"><label>Branch</label><input id="profileBranch" /></div>
                </div>
                <button class="btn btn-primary" id="updateProfileBtn"><i class="fas fa-save"></i> Update Profile</button>
            </div>
        </div>
    </div>
    <!-- login overlay -->
    <div class="login-page" id="loginPage" style="display:none;position:fixed;inset:0;z-index:9999;background:#f4f7fa;"><!-- same login box --></div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth(async (user) => {
                loadProfile();
            });
            attachLoginHandlers();

            async function loadProfile() {
                if (!currentUser) return;
                try {
                    const doc = await db.collection('users').doc(currentUser.uid).get();
                    if (doc.exists) {
                        const d = doc.data();
                        document.getElementById('profileName').value = d.displayName || d.email || '';
                        document.getElementById('profileEmail').value = d.email || currentUser.email || '';
                        document.getElementById('profileRole').value = d.role || 'user';
                        document.getElementById('profileBranch').value = d.branch || '';
                    }
                } catch(e) { console.warn(e); }
            }

            document.getElementById('updateProfileBtn').addEventListener('click', async () => {
                if (!currentUser) return;
                const name = document.getElementById('profileName').value.trim();
                const branch = document.getElementById('profileBranch').value.trim();
                try {
                    await db.collection('users').doc(currentUser.uid).update({ displayName: name, branch: branch, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                    if (currentUser.displayName !== name) await currentUser.updateProfile({ displayName: name });
                    showToast('Profile updated!');
                    document.getElementById('userDisplay').textContent = name || currentUser.email;
                } catch(e) { showToast(e.message, 'error'); }
            });
        });
    </script>
</body>
</html>
